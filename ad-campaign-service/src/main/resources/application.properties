server.port=8083

spring.datasource.url=jdbc:mysql://ad_engine_campaign_db:3306/campaign_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${CAMPAIGN_DB_USER:campaign_user}
spring.datasource.password=${CAMPAIGN_DB_PASSWORD:campaign_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Same secret as the Auth Service used to validate the JWT signature
app.jwtSecret=SuperSecretKeyForInGameAdEngineThatMustBeVeryLongAndSecure12345!
