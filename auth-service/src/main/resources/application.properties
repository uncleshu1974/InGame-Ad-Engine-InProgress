spring.application.name=auth-service
server.port=8084

# Connessione al Database (MySQL mappato sulla porta 3308 in localhost)
spring.datasource.url=jdbc:mysql://ad_engine_auth_db:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=auth_user
spring.datasource.password=auth_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate e JPA (Database-First: NON creare tabelle da Entity)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurazione Email (SMTP) passata tramite .env
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.trust=*
